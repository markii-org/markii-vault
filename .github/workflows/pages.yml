name: Deploy Mark II Vault to GitHub Pages

# Builds this showcase app and publishes it as a GitHub Pages project site
# served at /markii-vault/.
#
# One-time setup required in the repo: Settings -> Pages -> Source:
# "GitHub Actions".

on:
  push:
    branches: [main]
    # Rebuild only when the deployable content changes. Path filters are
    # checked against the whole push, so one relevant file anywhere in the
    # commit set triggers the build. Docs-only edits (README.md, anything
    # outside the list below) skip CI entirely; workflow_dispatch remains
    # as the manual force.
    paths:
      - playground/src/**
      - examples/**
      - playground/public/**
      - .github/workflows/pages.yml
      - playground/package.json
      - playground/package-lock.json
      - playground/vite.config.ts
      - playground/tsconfig.json
      - playground/index.html
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let in-flight deployments finish
# rather than cancelling them mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        working-directory: playground

      # Project sites are served under /<repo>/, so the app must be built
      # with that base path or asset URLs will 404. VITE_BASE is read by
      # vite.config.ts; local `npm run dev`/`build` are unaffected since the
      # env var is unset there and defaults to '/'.
      - name: Build app
        run: VITE_BASE=/markii-vault/ npm run build
        working-directory: playground

      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4